version = 0.1

# AWS Free plan fixes the project region to Sydney (ap-southeast-2). Keep this file ASCII: SAM CLI on Japanese Windows reads it as cp932.
[default.global.parameters]
region = "ap-southeast-2"

[default.build.parameters]
template_file = "infra/template.yaml"

[default.deploy.parameters]
stack_name = "salon-manual-qa"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
