AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  salon-manual-qa - マニュアルの取り込み（S3 → Lambda → Bedrock埋め込み → DynamoDB）と予算アラート。
  画面とAPI（Next.js）は Amplify Hosting で配信する（別途設定）。

Parameters:
  BudgetLimitUsd:
    Type: Number
    Default: 7
    Description: 月の予算上限（USD）。約1,000円の目安。
  AlertEmail:
    Type: String
    Description: 予算アラートの通知先メールアドレス
  EmbedModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 60

Resources:
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-documents-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ChunksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: chunkId
          AttributeType: S
      KeySchema:
        - AttributeName: chunkId
          KeyType: HASH

  QuestionLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: questionId
          AttributeType: S
      KeySchema:
        - AttributeName: questionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: functions/ingest/index.handler
      Environment:
        Variables:
          CHUNKS_TABLE: !Ref ChunksTable
          EMBED_MODEL_ID: !Ref EmbedModelId
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "${AWS::StackName}-documents-${AWS::AccountId}"
        - DynamoDBCrudPolicy:
            TableName: !Ref ChunksTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbedModelId}
      Events:
        Upload:
          Type: S3
          Properties:
            Bucket: !Ref DocumentsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: manuals/
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - functions/ingest/index.ts
        Target: es2022
        External:
          - "@aws-sdk/*"

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: salon-manual-qa-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
  ChunksTableName:
    Value: !Ref ChunksTable
  QuestionLogTableName:
    Value: !Ref QuestionLogTable
